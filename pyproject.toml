[project]
name = "topoflow"
version = "0.3.0"
description = "Atmospheric stagnation points on whole planets: Poincaré-Hopf closure, multi-reanalysis climatology, methane statistics, topological deep learning, and a 3-D globe."
requires-python = ">=3.10"
license = { text = "All rights reserved. Source available for viewing only; see LICENSE." }
# Floors include fixes for every advisory pip-audit reported on 2026-11-25 (requests, urllib3, werkzeug, certifi,
# pyarrow). Re-run `pip-audit` before each release.
dependencies = [
  "numpy",
  "scipy",
  "xarray",
  "netCDF4",
  "pandas",
  "pyarrow>=23.0.1",
  "requests>=2.33.0",
  "urllib3>=2.8.0",
  "certifi>=2026.10.18",
  "shapely>=2",
  "pydantic>=2",
  "numcodecs",
  "scikit-learn",
  "flask>=3.1.3",
  "werkzeug>=3.1.9",
  "dash",
  "plotly",
]

[project.optional-dependencies]
# Topological deep learning (topoflow.tdl). filelock comes in with torch; its floor carries the advisory fixes.
tdl = ["torch", "filelock>=4.2.1"]
# Keyed sources. Each is skipped with a stated reason when its credentials are absent.
cds = ["cdsapi"]
gee = ["earthengine-api"]
review = ["anthropic"]
dev = ["pytest", "pip-audit"]

[project.scripts]
topoflow = "topoflow.cli:main"

[tool.setuptools.packages.find]
include = ["topoflow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:dash"
